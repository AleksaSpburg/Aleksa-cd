<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Сравнение</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800&family=Cormorant+Garamond:ital,wght@1,300&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .test-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- ТВОЙ ФОН --- */
        .bg-main {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('img/bg-main-ru.png'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .bg-main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); 
        }

        .content-overlay {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ОБЩИЕ НАСТРОЙКИ ДЛЯ ОБОИХ ИМЕН (Мрамор + Золото) --- */
        .name-base {
            font-size: 5rem;
            margin: 0 0 30px 0;
            
            /* Мрамор внутри букв */
            background-image: url('img/bg-marble2.jpg');
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Золотой контур */
            -webkit-text-stroke: 2px #d4af37;
            
            /* Тень */
            filter: drop-shadow(0px 0px 15px rgba(212, 175, 55, 0.6)) drop-shadow(0px 5px 10px rgba(0,0,0,0.9));
            
            /* Анимация */
            animation: marble-shine 6s linear infinite;
        }

        @keyframes marble-shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* --- ПЕРВОЕ НАПИСАНИЕ (Cinzel) --- */
        .name-1 {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            letter-spacing: 10px;
        }

        /* --- ВТОРОЕ НАПИСАНИЕ (TagType) --- */
        .name-2 {
            font-family: 'TagType', cursive;
            letter-spacing: 8px;
        }

        /* Вопрос */
        .q-1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .label {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            font-size: 0.8rem;
            color: #d4af37;
            z-index: 10;
            border: 1px solid #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .name-base { font-size: 3rem; -webkit-text-stroke: 1.5px #d4af37; }
            .name-1 { letter-spacing: 5px; }
            .name-2 { letter-spacing: 4px; }
            .q-1 { font-size: 1.5rem; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <!-- ПЕРВОЕ НАПИСАНИЕ -->
    <div class="test-section">
        <div class="label">Первое написание (Cinzel)</div>
        <div class="bg-main"></div>
        <div class="content-overlay">
            <h1 class="name-base name-1">ALEKSA</h1>
            <div class="q-1">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        </div>
    </div>

    <!-- ВТОРОЕ НАПИСАНИЕ -->
    <div class="test-section">
        <div class="label">Второе написание (TagType)</div>
        <div class="bg-main"></div>
        <div class="content-overlay">
            <h1 class="name-base name-2">ALEKSA</h1>
            <div class="q-1">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        </div>
    </div>

</body>
</html>
