
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Главная</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Montserrat:wght@300&family=Caveat:wght@400&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('img/bg-marble2.jpg'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* Затемнение фона */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); 
            z-index: -1;
        }

        .photo-placeholder {
            width: 250px;
            height: 350px;
            background-color: #111;
            border: 1px solid #d4af37;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            /* Сюда мы потом вставим твое фото */
        }

        .name-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            letter-spacing: 10px;
            color: #d4af37;
            margin: 0 0 40px 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .question-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
            margin-top: 20px;
            max-width: 90%;
        }

        /* --- 4 ВАРИАНТА ВОПРОСА --- */
        
        /* 1. Элегантный (как Vogue) */
        .q-elegant {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.8rem;
            color: #fff;
            opacity: 0.9;
        }

        /* 2. Кибер-нуар (Твой шрифт) */
        .q-tagtype {
            font-family: 'TagType', cursive;
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-stroke: 1px #d4af37;
            letter-spacing: 2px;
        }

        /* 3. Минимализм */
        .q-minimal {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ccc;
        }

        /* 4. Рукописный */
        .q-caveat {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: #d4af37;
        }

        /* Кнопка назад для тестов */
        .back-btn {
            margin-top: 50px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="photo-placeholder">Здесь будет твое фото</div>
    <h1 class="name-title">ALEKSA</h1>
    
    <div class="question-container">
        <div class="q-elegant">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        <div class="q-tagtype">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        <div class="q-minimal">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        <div class="q-caveat">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
    </div>

    <a href="index.html" class="back-btn">Вернуться к интро</a>

</body>
</html>
