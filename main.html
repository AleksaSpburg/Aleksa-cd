<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Liquid Marble</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .test-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- ТВОЙ ФОН ИЗ GITHUB --- */
        .bg-main {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('img/bg-main-ru.png'); /* Твой файл */
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Легкое затемнение, чтобы текст читался */
        .bg-main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); 
        }

        .content-overlay {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ВАРИАНТ 1: LIQUID CHROME (Серебряный хром, шрифт Cinzel) --- */
        .name-chrome {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 10px;
            margin: 0 0 30px 0;
            
            background: linear-gradient(to bottom, #ffffff 0%, #a3a3a3 45%, #171717 50%, #737373 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.9));
            transition: all 0.5s ease;
        }

        .name-chrome:hover {
            letter-spacing: 15px;
            transform: scale(1.05);
        }

        /* --- ВАРИАНТ 2: LIQUID GOLD MARBLE (Жидкое золото + твой шрифт) --- */
        .name-liquid-marble {
            font-family: 'TagType', cursive;
            font-size: 5rem;
            letter-spacing: 8px;
            margin: 0 0 30px 0;
            
            background: linear-gradient(135deg, #111 0%, #d4af37 25%, #111 50%, #fceabb 75%, #8a6d3b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Вопрос */
        .q-1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .label {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            font-size: 0.8rem;
            color: #888;
            z-index: 10;
            border: 1px solid #333;
        }

        @media (max-width: 768px) {
            .name-chrome, .name-liquid-marble {
                font-size: 3rem;
            }
            .q-1 { font-size: 1.5rem; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <!-- ВАРИАНТ 1: Серебряный хром -->
    <div class="test-section">
        <div class="label">Имя: Liquid Chrome (Серебро)</div>
        <div class="bg-main"></div>
        <div class="content-overlay">
            <h1 class="name-chrome">ALEKSA</h1>
            <div class="q-1">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        </div>
    </div>

    <!-- ВАРИАНТ 2: Жидкое золото с черным мрамором -->
    <div class="test-section">
        <div class="label">Имя: Liquid Marble (Золото + Камень)</div>
        <div class="bg-main"></div>
        <div class="content-overlay">
            <h1 class="name-liquid-marble">ALEKSA</h1>
            <div class="q-1">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
        </div>
    </div>

</body>
</html>
