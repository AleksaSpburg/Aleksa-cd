<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100svh;
            /* Твой фон, центрируем так, чтобы голова была в середине */
            background: url("img/bg-main-ru.png") center 40% / cover no-repeat;
            overflow: hidden;
        }

        /* Легкое затемнение, чтобы текст читался */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.1) 70%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        /* --- ВЕРХНЯЯ ФРАЗА --- */
        .top-text {
            position: absolute;
            top: 8vh;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            
            /* Анимация появления */
            opacity: 0;
            animation: fadeIn 2s ease 0.5s forwards;
        }

        /* --- ИМЯ (Граффити) --- */
        .name {
            position: absolute;
            /* Позиционируем ровно над головой */
            top: 20vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            
            font-family: 'TagType', cursive;
            font-size: clamp(6rem, 22vw, 14rem);
            line-height: 0.9;
            letter-spacing: 5px;
            white-space: nowrap;
            
            /* Премиальный металлический градиент */
            background: linear-gradient(180deg, #f6e6b6 0%, #cba14b 45%, #7a5c1a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
            
            /* Анимация проявления */
            clip-path: inset(0 100% 0 0);
            animation: reveal 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
        }

        /* --- НИЖНЯЯ ФРАЗА --- */
        .bottom-text {
            position: absolute;
            bottom: 8vh;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            
            /* Анимация появления */
            opacity: 0;
            animation: fadeIn 2s ease 1.5s forwards;
        }

        @keyframes reveal {
            to { clip-path: inset(0 0 0 0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 768px) {
            .hero {
                background-position: center 35%;
            }
            .name {
                top: 18vh;
                font-size: 8rem; /* Корректируем, чтобы влезло */
            }
            .top-text {
                top: 6vh;
                font-size: 1.1rem;
            }
            .bottom-text {
                bottom: 6vh;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Верхняя фраза (обычный шрифт) -->
        <div class="top-text">Хм... ты здесь..</div>

        <!-- Имя (граффити) -->
        <h1 class="name">Aleksa</h1>

        <!-- Нижняя фраза (обычный шрифт) -->
        <div class="bottom-text">это обо мне... или о тебе?</div>
    </section>

</body>
</html>
