
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* --- ТВОЙ ФОН ИЗ GITHUB --- */
        .bg-main {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('img/bg-main-ru.png'); /* Твой файл */
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Легкое затемнение, чтобы текст читался */
        .bg-main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); 
        }

        .content-overlay {
            position: relative;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10vh;
        }

        /* --- ФИНАЛЬНОЕ ИМЯ: LIQUID MARBLE + GOLD OUTLINE --- */
        .name-liquid-marble {
            font-family: 'TagType', cursive;
            font-size: 5rem;
            letter-spacing: 8px;
            margin: 0 0 30px 0;
            
            /* Берем текстуру мрамора внутрь букв */
            background-image: url('img/bg-marble2.jpg');
            background-size: 300% auto; /* Растягиваем, чтобы прожилки были крупнее */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Золотой контур, чтобы буквы не сливались с фоном */
            -webkit-text-stroke: 2px #d4af37;
            
            /* Тень для объема и свечения */
            filter: drop-shadow(0px 0px 15px rgba(212, 175, 55, 0.6)) drop-shadow(0px 5px 10px rgba(0,0,0,0.9));
            
            /* Анимация переливания */
            animation: marble-shine 6s linear infinite;
        }

        @keyframes marble-shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Вопрос */
        .q-1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.4);
            
            /* Плавное появление вопроса */
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
            animation-delay: 1s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 768px) {
            .name-liquid-marble {
                font-size: 3.5rem;
                -webkit-text-stroke: 1.5px #d4af37;
            }
            .q-1 { 
                font-size: 1.4rem; 
                padding: 0 20px; 
            }
            .content-overlay {
                margin-top: 0; /* На телефоне лучше по центру */
            }
        }
    </style>
</head>
<body>

    <div class="bg-main"></div>

    <div class="content-overlay">
        <h1 class="name-liquid-marble">ALEKSA</h1>
        <div class="q-1">Хм.. Ты здесь. Это обо мне или... о тебе?</div>
    </div>

</body>
</html>
