<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Raleway', sans-serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100svh;
            background: url("img/bg-main-ru.png") center 35% / cover no-repeat;
            overflow: hidden;
            /* ДОБАВЛЯЕМ РЕЗКОСТИ И КОНТРАСТА САМОЙ КАРТИНКЕ */
            filter: contrast(1.15) brightness(1.1);
        }

        /* Убираем "туман". Затемняем только края, оставляя центр нетронутым */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at center 35%, rgba(0,0,0,0) 15%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.98) 100%);
            z-index: 1;
        }

        /* Легкое кинематографичное зерно */
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            z-index: 2;
            pointer-events: none;
        }

        .top-text, .bottom-text {
            position: absolute;
            width: 100%;
            text-align: center;
            z-index: 3;
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            font-weight: 300;
            color: #e5e5e5; /* Чистый, но не режущий глаз белый */
            letter-spacing: 0.3em; /* Широкие пробелы */
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .top-text { top: 8vh; }
        .bottom-text { bottom: 8vh; }

        .name {
            position: absolute;
            top: 15vh; 
            width: 100%;
            text-align: center;
            z-index: 3;
            font-family: 'Raleway', sans-serif;
            font-weight: 200;
            font-size: clamp(4.5rem, 15vw, 9rem);
            letter-spacing: 0.15em;
            padding-left: 0.15em;
            color: #f0f4f8;
            text-shadow: 0 0 20px rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.9);
            
            clip-path: inset(0 100% 0 0);
            animation: reveal 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        }

        @keyframes reveal { to { clip-path: inset(0 0 0 0); } }

        @media (max-width: 768px) {
            .hero { background-position: center 30%; }
            .name { top: 12vh; font-size: 4.5rem; letter-spacing: 0.1em; padding-left: 0.1em; }
            .top-text, .bottom-text { letter-spacing: 2px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="top-text">Хм... ты здесь..</div>
        <h1 class="name">Aleksa</h1>
        <div class="bottom-text">это обо мне... или о тебе?</div>
    </section>

</body>
</html>
