
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- МАГИЯ ПЛАВНОГО ПЕРЕХОДА --- */
        @view-transition {
            navigation: auto;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            height: 100svh;
            background: url("img/bg-main-ru.png") center 35% / cover no-repeat;
            overflow: hidden;
            
            /* Плавное появление страницы при загрузке */
            animation: pageFadeIn 1.5s ease forwards;
            opacity: 0; 
        }

        @keyframes pageFadeIn {
            to { opacity: 1; }
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 35%, rgba(0,0,0,0.2) 65%, rgba(0,0,0,0.95) 100%);
            z-index: 1;
        }

        .top-text {
            position: absolute;
            top: 8vh;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-style: italic;
            color: #c2b29a;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            
            opacity: 0;
            animation: fadeIn 2s ease 1s forwards;
        }

        .name {
            position: absolute;
            top: 18vh; 
            width: 100%;
            text-align: center;
            z-index: 2;
            
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(5rem, 18vw, 11rem);
            line-height: 0.9;
            letter-spacing: 0.01em;
            
            background: linear-gradient(180deg, #f6e6b6 0%, #cba14b 45%, #7a5c1a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9));
            
            clip-path: inset(0 100% 0 0);
            animation: reveal 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        }

        .bottom-text {
            position: absolute;
            bottom: 8vh;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-style: italic;
            color: #c2b29a;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            
            opacity: 0;
            animation: fadeIn 2s ease 2s forwards;
        }

        @keyframes reveal {
            to { clip-path: inset(0 0 0 0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .hero {
                background-position: center 30%;
            }
            .name {
                top: 16vh;
                font-size: 6rem;
            }
            .top-text, .bottom-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="top-text">Хм... ты здесь..</div>
        <h1 class="name">Aleksa</h1>
        <div class="bottom-text">это обо мне... или о тебе?</div>
    </section>

</body>
</html>
