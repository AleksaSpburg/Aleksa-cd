<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .hero {
            position: relative;
            height: 100svh;
            background: url("img/bg-main-ru.png") 70% 40% / cover no-repeat;
            display: flex;
            align-items: center; 
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 40%, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 50%, rgba(0,0,0,0.98) 100%);
            z-index: 1;
        }

        /* Верхняя навигация */
        .top-nav {
            position: absolute;
            top: 40px;
            left: 10vw;
            z-index: 5;
        }

        .nav-name {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #d4b5a5; /* Приглушенное розовое золото */
            opacity: 0.8;
        }

        /* --- КОНТЕНТ СЛЕВА --- */
        .content {
            position: relative;
            z-index: 2;
            margin-left: 10vw; 
            width: 40%; 
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 2rem; 
        }

        /* Главное имя */
        .name {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(5rem, 10vw, 9rem);
            line-height: 0.9;
            letter-spacing: 0.01em;
            
            /* --- РОЗОВОЕ ЗОЛОТО --- */
            background: linear-gradient(180deg, #f9e0d9 0%, #d4a373 45%, #8c5a35 100%);
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Вот та самая строчка, которая чинит баг с квадратом: */
            -webkit-text-fill-color: transparent; 
            color: transparent; 
            
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.9));
            
            clip-path: inset(0 100% 0 0);
            animation: reveal 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
        }

        @keyframes reveal {
            to { clip-path: inset(0 0 0 0); }
        }

        /* Стили для текста вопросов */
        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            color: #d4b5a5; /* Теплый розово-песочный */
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            opacity: 0;
            animation: fadeIn 2s ease 1.5s forwards;
            text-align: left;
        }

        @keyframes fadeIn {
            to { opacity: 0.9; }
        }

        @media (prefers-reduced-motion: reduce) {
            .name, .quote-text {
                animation: none;
                clip-path: none;
                opacity: 1;
            }
        }

        /* --- ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 768px) {
            .hero {
                background-position: 60% 40%;
                align-items: flex-start;
                padding-top: 25vh; 
            }
            .hero::before {
                background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.95) 100%);
            }
            .top-nav {
                left: 50%;
                transform: translateX(-50%); 
            }
            .content {
                margin-left: 8vw;
                width: 85%; 
                align-items: center; 
                gap: 1.5rem;
            }
            .quote-text {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="top-nav">
            <div class="nav-name">ALEKSA</div>
        </div>

        <div class="content">
            <p class="quote-text">Хм.. Ты здесь.</p>
            <h1 class="name">Aleksa</h1>
            <p class="quote-text">Это обо мне или... о тебе?</p>
        </div>
    </section>

</body>
</html>
