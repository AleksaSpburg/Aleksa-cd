<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Bento Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000; /* Глубокий черный */
            color: #fff;
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px; /* Высота базовой ячейки */
            gap: 15px;
            max-width: 1000px;
            width: 100%;
        }

        /* --- КАРТОЧКИ --- */
        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            
            /* ВОТ ТА САМАЯ МАГИЯ ВИНТАЖНОЙ ПЛЕНКИ (CSS) */
            filter: sepia(0.3) contrast(1.2) grayscale(0.2) brightness(0.7);
            transition: all 0.5s ease;
        }

        .card:hover .card-bg {
            filter: sepia(0.1) contrast(1.1) grayscale(0) brightness(0.9); /* При наведении фото "оживает" */
            transform: scale(1.05);
        }

        /* Затемнение для текста */
        .card-content {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            z-index: 2;
        }

        /* --- ТЕКСТ ВНУТРИ КАРТОЧЕК --- */
        .card-title {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 5px;
        }

        .card-subtitle {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #aaa;
            text-transform: uppercase;
        }

        /* --- РАЗМЕРЫ КАРТОЧЕК (СЕТКА) --- */
        
        /* Главное фото (вертикальное, занимает 2 колонки и 2 ряда) */
        .card.large {
            grid-column: span 2;
            grid-row: span 2;
        }
        .card.large .card-title { font-size: 2rem; }

        /* Широкая карточка (горизонтальная, на 2 колонки) */
        .card.wide {
            grid-column: span 2;
            grid-row: span 1;
        }

        /* Маленькие квадратные карточки (1x1) */
        .card.small {
            grid-column: span 1;
            grid-row: span 1;
        }

        /* --- МОБИЛЬНАЯ ВЕРСИЯ --- */
        @media (max-width: 768px) {
            .bento-container {
                grid-template-columns: 1fr; /* На телефоне в один столбец */
                grid-auto-rows: 250px;
            }
            .card.large, .card.wide, .card.small {
                grid-column: span 1;
                grid-row: span 1;
            }
            .card.large { grid-row: span 2; } /* Главное фото на телефоне будет самым высоким */
        }
    </style>
</head>
<body>

    <div class="bento-container">
        
        <!-- 1. Главное фото (Крупная карточка) -->
        <!-- ВСТАВЬ СЮДА СВОЕ ЛУЧШЕЕ ФОТО (например: img/photo-1.jpg) -->
        <div class="card large">
            <div class="card-bg" style="background-image: url('img/bg-main-ru.png');"></div>
            <div class="card-content">
                <div class="card-title">Aleksa</div>
                <div class="card-subtitle">Silence. Skin. Solitude.</div>
            </div>
        </div>

        <!-- 2. Широкая карточка (Ссылка на Telegram) -->
        <!-- ВСТАВЬ СЮДА ДЕТАЛЬ (например: img/photo-2.jpg) -->
        <div class="card wide">
            <div class="card-bg" style="background-image: url('img/bg-gallery.jpg');"></div>
            <div class="card-content">
                <div class="card-title">Telegram</div>
                <div class="card-subtitle">Backstage & Private</div>
            </div>
        </div>

        <!-- 3. Маленькая карточка (Ссылка на TonPlace) -->
        <!-- ВСТАВЬ СЮДА ДЕТАЛЬ (например: img/photo-3.jpg) -->
        <div class="card small">
            <div class="card-bg" style="background-image: url('img/bg-links.jpg');"></div>
            <div class="card-content">
                <div class="card-title">TonPlace</div>
                <div class="card-subtitle">Exclusive</div>
            </div>
        </div>

        <!-- 4. Маленькая карточка (Ссылка на BBS) -->
        <!-- ВСТАВЬ СЮДА ДЕТАЛЬ (например: img/photo-4.jpg) -->
        <div class="card small">
            <div class="card-bg" style="background-image: url('img/bg-main-en.jpg');"></div>
            <div class="card-content">
                <div class="card-title">BBS</div>
                <div class="card-subtitle">Community</div>
            </div>
        </div>

        <!-- 5. Широкая карточка (Цитата или Deep Access) -->
        <!-- ВСТАВЬ СЮДА ДЕТАЛЬ (например: img/photo-5.jpg) -->
        <div class="card wide">
            <div class="card-bg" style="background-image: url('img/bg-access.jpg');"></div>
            <div class="card-content">
                <div class="card-title">Deep Access</div>
                <div class="card-subtitle">Private Terminal</div>
            </div>
        </div>

    </div>

</body>
</html>
