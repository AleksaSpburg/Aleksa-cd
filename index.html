<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Новый шрифт: Playfair Display (для текста) и Montserrat (для мелких надписей) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Playfair Display', serif;
            overflow: hidden; 
            /* Растягиваем на весь экран */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            /* Размер шрифта теперь крупнее и адаптивный */
            font-size: clamp(2rem, 5vw, 4.5rem); 
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4em;
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(30px);
            /* Появление стало медленнее */
            transition: opacity 2s ease, transform 2s ease;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); 
        }

        /* НОВЫЙ ЭФФЕКТ РАЗЛЕТА (Сгорание / Дымка) */
        .word.explode {
            opacity: 0;
            /* Увеличиваем размер, улетаем и вращаем */
            transform: translate(var(--x), var(--y)) scale(2) rotate(var(--r));
            /* Вспышка красным и сильное размытие */
            color: #ff003c; 
            text-shadow: 0 0 40px #ff003c, 0 0 80px #ff003c;
            filter: blur(20px); 
            /* Длительность разлета */
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            color: gray;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено. Нажмите F5, чтобы перезагрузить.</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            // 1. Появление слов (дольше, до 4 секунд)
            wordElements.forEach(word => {
                const delay = Math.random() * 4000; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            // 2. Пауза и разлет (через 6 секунд после старта)
            setTimeout(() => {
                wordElements.forEach(word => {
                    const x = (Math.random() - 0.5) * 800 + 'px'; 
                    const y = (Math.random() - 0.5) * 800 + 'px'; 
                    const r = (Math.random() - 0.5) * 120 + 'deg'; 
                    
                    word.style.setProperty('--x', x);
                    word.style.setProperty('--y', y);
                    word.style.setProperty('--r', r);
                    
                    word.classList.add('explode');
                });
            }, 6000); // Ждем 6 секунд

            // 3. Конец (появление серой надписи через 8 секунд)
            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, 8000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
