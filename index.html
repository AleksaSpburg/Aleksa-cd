<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            /* Имитация черного мрамора на фоне (радиальный градиент) */
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            color: #fff;
            font-family: 'TagType', cursive; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 95%; 
            max-width: 1100px;
            text-align: center;
            font-size: clamp(1.8rem, 4.5vw, 3.5rem); 
            line-height: 2; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em; 
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            letter-spacing: 5px; 
            
            /* --- ЭФФЕКТ ЗОЛОТОГО МРАМОРА --- */
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Добавляем золотую тень, чтобы текст выделялся на черном */
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            /* Усиливаем золотое свечение при появлении */
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.7));
        }

        /* --- РАСТВОРЕНИЕ (Золотая пыль) --- */
        .word.explode {
            opacity: 0;
            transform: scale(1.3); 
            
            /* Убираем градиент, чтобы текст мог исчезнуть */
            background: none;
            -webkit-text-fill-color: rgba(212, 175, 55, 0.2);
            color: transparent; 
            
            /* Эффект мощной вспышки и размытия */
            filter: blur(25px) drop-shadow(0 0 50px rgba(212, 175, 55, 1));
            transition: all 4s ease-in-out; 
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 0.8rem;
            font-family: sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            const wordDelay = 600; 

            wordElements.forEach((word, index) => {
                const delay = index * wordDelay; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            const explodeDelay = (wordElements.length * wordDelay) + 4000; 
            
            setTimeout(() => {
                wordElements.forEach(word => {
                    word.classList.add('explode');
                });
            }, explodeDelay); 

            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, explodeDelay + 4000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
