<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <style>
        /* Возвращаем твой граффити-шрифт */
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'TagType', cursive; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 95%; /* Чуть шире, чтобы текст дышал */
            max-width: 1100px;
            text-align: center;
            font-size: clamp(1.8rem, 4.5vw, 3.5rem); /* Размер подогнан под TagType */
            line-height: 1.8; /* ОГРОМНОЕ расстояние между строками, чтобы не слипалось */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4em; /* Расстояние между словами */
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            letter-spacing: 3px; /* РАЗДВИГАЕМ БУКВЫ внутри слова */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* Тень для объема */
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); 
        }

        .word.explode {
            opacity: 0;
            transform: translate(var(--x), var(--y)) scale(1.2) rotate(var(--r));
            color: #ff003c; 
            text-shadow: 0 0 30px #ff003c, 0 0 60px #ff003c;
            filter: blur(10px); 
            transition: all 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 0.8rem;
            font-family: sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            // Сделал появление чуть медленнее (600мс), чтобы соответствовало стилю
            const wordDelay = 600; 

            wordElements.forEach((word, index) => {
                const delay = index * wordDelay; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            const explodeDelay = (wordElements.length * wordDelay) + 4000; 
            
            setTimeout(() => {
                wordElements.forEach(word => {
                    const x = (Math.random() - 0.5) * 600 + 'px'; 
                    const y = (Math.random() - 0.5) * 600 + 'px'; 
                    const r = (Math.random() - 0.5) * 60 + 'deg'; 
                    
                    word.style.setProperty('--x', x);
                    word.style.setProperty('--y', y);
                    word.style.setProperty('--r', r);
                    
                    word.classList.add('explode');
                });
            }, explodeDelay); 

            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, explodeDelay + 3000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
