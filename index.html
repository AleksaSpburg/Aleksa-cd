<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Подключаем рукописный шрифт Great Vibes и Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            /* Рукописный шрифт */
            font-family: 'Great Vibes', cursive; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            /* Для рукописных шрифтов размер нужен больше, так как они визуально мельче */
            font-size: clamp(2.5rem, 6vw, 5rem); 
            line-height: 1.5; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3em;
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            /* Немного смещаем вниз для эффекта проявления */
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); 
        }

        /* Разлет с красной вспышкой */
        .word.explode {
            opacity: 0;
            transform: translate(var(--x), var(--y)) scale(1.2) rotate(var(--r));
            color: #ff003c; 
            text-shadow: 0 0 30px #ff003c, 0 0 60px #ff003c;
            filter: blur(10px); 
            transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 0.8rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            // Слова появляются ПО ПОРЯДКУ, а не рандомно
            wordElements.forEach((word, index) => {
                // Каждое следующее слово ждет 250 миллисекунд (0.25 сек) после предыдущего
                const delay = index * 250; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            // Пауза после того, как все слова появились (например, 3 секунды) и разлет
            // Общее время появления = 11 слов * 250мс = 2750мс. Добавляем паузу 3000мс.
            const explodeDelay = (wordElements.length * 250) + 3000; 
            
            setTimeout(() => {
                wordElements.forEach(word => {
                    const x = (Math.random() - 0.5) * 600 + 'px'; 
                    const y = (Math.random() - 0.5) * 600 + 'px'; 
                    const r = (Math.random() - 0.5) * 60 + 'deg'; 
                    
                    word.style.setProperty('--x', x);
                    word.style.setProperty('--y', y);
                    word.style.setProperty('--r', r);
                    
                    word.classList.add('explode');
                });
            }, explodeDelay); 

            // Конец
            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, explodeDelay + 2000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
