
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">
    
    <style>
        @view-transition { navigation: auto; }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('img/bg-marble2.jpg'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Raleway', sans-serif; /* Единый шрифт */
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        body.fade-out { opacity: 0; }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); /* Чуть темнее, чтобы белый текст читался */
            z-index: -1;
        }

        #intro-container {
            width: 95%; 
            max-width: 1100px;
            text-align: center;
            font-size: clamp(1.2rem, 3.5vw, 2.2rem); 
            font-weight: 200; /* Тонкий */
            line-height: 1.8; 
            letter-spacing: 0.1em; /* Разрядка */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em; 
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            color: #e5e5e5; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); 
        }

        .word.explode {
            opacity: 0;
            transform: scale(1.1); 
            filter: blur(20px);
            transition: all 4s ease-in-out; 
            text-shadow: none; 
        }

        @media (max-width: 768px) {
            #intro-container {
                transform: translateY(-10vh); 
                font-size: clamp(1.5rem, 6vw, 2rem); 
                line-height: 1.6; 
            }
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя...";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            const wordDelay = 500; 

            wordElements.forEach((word, index) => {
                const delay = index * wordDelay; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            const explodeDelay = (wordElements.length * wordDelay) + 3500; 
            
            setTimeout(() => {
                wordElements.forEach(word => {
                    word.classList.add('explode');
                });

                setTimeout(() => {
                    document.body.classList.add('fade-out');
                }, 2500); 

                setTimeout(() => {
                    window.location.href = 'garland.html'; /* Ведем на гирлянду */
                }, 3500); 

            }, explodeDelay); 
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
