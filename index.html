<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden; /* Запрещаем скролл на время интро */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            position: relative;
            width: 90%;
            max-width: 900px;
            text-align: center;
            font-size: clamp(1.5rem, 4vw, 3rem);
            line-height: 1.5;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3em;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* Легкое свечение */
        }

        /* Эффект разлета */
        .word.explode {
            opacity: 0;
            transform: translate(var(--x), var(--y)) scale(0.5) rotate(var(--r));
            transition: all 1.2s cubic-bezier(0.5, 0, 0.2, 1);
            filter: blur(8px); /* Размытие при разлете */
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 1rem;
            font-family: sans-serif;
            color: gray;
            transition: opacity 1s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено. Нажмите F5, чтобы перезагрузить.</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        // Создаем элементы для каждого слова
        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        // Запускаем анимацию
        function startAnimation() {
            // 1. Появление слов (рандомно)
            wordElements.forEach(word => {
                // Случайная задержка от 0 до 2.5 секунд
                const delay = Math.random() * 2500; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            // 2. Пауза и разлет (через 4 секунды после старта)
            setTimeout(() => {
                wordElements.forEach(word => {
                    // Случайное направление разлета
                    const x = (Math.random() - 0.5) * 600 + 'px'; // Влево/вправо
                    const y = (Math.random() - 0.5) * 600 + 'px'; // Вверх/вниз
                    const r = (Math.random() - 0.5) * 90 + 'deg'; // Вращение
                    
                    word.style.setProperty('--x', x);
                    word.style.setProperty('--y', y);
                    word.style.setProperty('--r', r);
                    
                    word.classList.add('explode');
                });
            }, 4000);

            // 3. Конец (через 5.5 секунд)
            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, 5500);
        }

        // Запуск после загрузки страницы
        window.onload = startAnimation;
    </script>
</body>
</html>
