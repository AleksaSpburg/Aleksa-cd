<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Подключаем Bodoni Moda и Montserrat для надписи внизу -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Bodoni Moda', serif; /* Новый дорогой шрифт */
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            font-size: clamp(1.8rem, 4vw, 3.5rem); 
            line-height: 1.6; /* Чуть больше воздуха между строками */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4em;
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(20px);
            transition: opacity 2s ease, transform 2s ease;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); 
        }

        .word.explode {
            opacity: 0;
            transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r));
            color: #ff003c; 
            text-shadow: 0 0 30px #ff003c, 0 0 60px #ff003c;
            filter: blur(15px); 
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            wordElements.forEach(word => {
                const delay = Math.random() * 4000; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            setTimeout(() => {
                wordElements.forEach(word => {
                    const x = (Math.random() - 0.5) * 800 + 'px'; 
                    const y = (Math.random() - 0.5) * 800 + 'px'; 
                    const r = (Math.random() - 0.5) * 120 + 'deg'; 
                    
                    word.style.setProperty('--x', x);
                    word.style.setProperty('--y', y);
                    word.style.setProperty('--r', r);
                    
                    word.classList.add('explode');
                });
            }, 6000); 

            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, 8000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
