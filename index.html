<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            
            /* Ссылка на КАЧЕСТВЕННЫЙ черный мрамор с золотом */
            background-image: url('https://images.unsplash.com/photo-1550537687-c91072c4792d?q=80&w=2560&auto=format&fit=crop'); 
            
            /* Настройки единого полотна */
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            
            color: #fff;
            font-family: 'TagType', cursive; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Затемнение, чтобы мрамор не перебивал текст */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
            pointer-events: none;
        }

        #intro-container {
            width: 95%; 
            max-width: 1100px;
            text-align: center;
            font-size: clamp(1.8rem, 4.5vw, 3.5rem); 
            line-height: 2; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em; 
            padding: 20px;
            position: relative;
            z-index: 1; 
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            letter-spacing: 5px; 
            
            color: #ffffff;
            -webkit-text-stroke: 1px #d4af37; /* Золотой контур */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.8), 0 0 10px rgba(255, 255, 255, 0.5); 
        }

        .word.explode {
            opacity: 0;
            transform: scale(1.1); 
            color: rgba(212, 175, 55, 0.3); 
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
            filter: blur(20px) drop-shadow(0 0 40px rgba(255, 215, 0, 1));
            transition: all 4s ease-in-out; 
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            const wordDelay = 600; 

            wordElements.forEach((word, index) => {
                const delay = index * wordDelay; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            const explodeDelay = (wordElements.length * wordDelay) + 4000; 
            
            setTimeout(() => {
                wordElements.forEach(word => {
                    word.classList.add('explode');
                });
            }, explodeDelay); 
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
