<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алекса | Official Hub</title>
    <!-- Подключаем современные, более дерзкие и премиальные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --border-color: #262626;
            --accent-pink: #d946ef;
            --accent-blue: #3b82f6;
            --text-main: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            /* Эффект пленочного зерна (тактильный шум) на чистом CSS */
            background-color: var(--bg-color);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org width='100%25' height='100%25' fill='%230b0b0b'/%3e%3cfilter id='noise'%3e%3cfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3e%3c/svg%3e");
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Главный хаб-контейнер */
        .hub-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
            padding: 20px 0;
        }

        /* Блок профиля */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
        }

        /* Интерактивное неоновое кольцо вокруг фото */
        .profile-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 2;
        }

        .avatar-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            z-index: 1;
            opacity: 0.4;
            filter: blur(4px);
        }

        .avatar-wrapper:hover::after {
            opacity: 1;
            filter: blur(8px);
            transform: rotate(180deg);
        }

        /* Эффект жидкого хрома (Liquid Chrome) для имени */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8em;
            font-weight: 800;
            margin: 10px 0 5px 0;
            letter-spacing: 4px;
            background: linear-gradient(to bottom, #ffffff 0%, #a3a3a3 45%, #171717 50%, #737373 55%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        h1:hover {
            letter-spacing: 8px;
            transform: scale(1.02);
        }

        p.subtitle {
            font-size: 0.75em;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }

        /* Сетка бруталистичных карточек */
        .bento-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Базовый стиль карточки-ссылки */
        .bento-card {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(23, 23, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Светящийся внутренний слой при наведении */
        .bento-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(217, 70, 239, 0.08), rgba(59, 130, 246, 0.08));
            opacity: 0;
        }

        .bento-card:hover {
            border-color: #525252;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .bento-card:hover::before {
            opacity: 1;
        }

        .card-info {
            text-align: left;
        }

        .card-tag {
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a3a3a3;
            display: block;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.05em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-arrow {
            font-size: 1.2em;
            color: #525252;
        }

        .bento-card:hover .card-arrow {
            color: #fff;
            transform: translate(2px, -2px);
        }

        /* Особый стиль для главной платформы */
        .bento-card.primary-platform {
            border-color: rgba(217, 70, 239, 0.3);
        }
        .bento-card.primary-platform .card-tag {
            color: var(--accent-pink);
            font-weight: 600;
        }

        /* ЯЧЕЙКА С ТИЗЕРОМ (Скрытый контент) */
        .teaser-card {
            position: relative;
            background: rgba(23, 23, 23, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Размытый бэкграунд-заглушка */
        .teaser-blur-bg {
            absolute: inset 0;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://unsplash.com') center/cover;
            filter: blur(25px);
            opacity: 0.15;
            z-index: 1;
        }

        .teaser-card:hover .teaser-blur-bg {
            opacity: 0.3;
            transform: scale(1.05);
        }

        .teaser-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tag-locked { color: #f59e0b; font-weight: 600; }
        .tag-age { color: #737373; }

        .teaser-body {
            position: relative;
            z-index: 2;
            text-align: left;
        }
        .teaser-title {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .teaser-desc {
            font-size: 0.8em;
            color: #a3a3a3;
            line-height: 1.4;
        }

        /* Кнопка внутри тизера */
        .teaser-btn {
            position: relative;
            z-index: 2;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .teaser-btn:hover {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
        }

        footer {
            font-size: 0.6em;
            color: #404040;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>
