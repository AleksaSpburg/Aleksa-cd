<!DOCTYPE html>
<html lang="ru" id="top">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Official</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗА */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background-color: #000; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
        }

        section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
        }

        /* 1. ИНТРО */
        .section-intro {
            height: 100svh;
            text-align: center;
            background-color: #0a0a0a; 
        }
        .intro-text {
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: clamp(1.2rem, 3vw, 2rem);
            line-height: 1.8;
            color: #f0f4f8;
            max-width: 800px;
            letter-spacing: 0.15em;
        }

        /* 2. ГЛАВНАЯ (Исправлено обрезание имени) */
        .section-hero {
            height: 100svh;
            border-bottom: 1px solid #111; 
            padding: 0;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }
        .hero-bg {
            position: absolute;
            top: 0; right: 0;
            width: 80%; height: 100%;
            background: url('img/bg-main-ru.png') center top/cover no-repeat;
            z-index: 1;
            mask-image: radial-gradient(ellipse 60% 70% at 60% 40%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 60% 70% at 60% 40%, black 20%, transparent 70%);
            opacity: 0.85;
        }
        .hero-text-top {
            position: absolute; top: 6vh; left: 50%; transform: translateX(-50%);
            font-family: 'Raleway', sans-serif; font-weight: 300; font-size: 1rem;
            letter-spacing: 0.3em; text-transform: uppercase; color: #888;
            width: 100%; text-align: center; z-index: 3;
        }
        
        .hero-name {
            position: absolute; 
            top: 42%; 
            left: 12vw; /* Безопасный отступ слева */
            transform: translateY(-50%);
            font-family: 'Raleway', sans-serif; font-weight: 200;
            font-size: clamp(3.5rem, 10vw, 9rem); /* Немного уменьшили максимальный размер */
            letter-spacing: 0.1em; 
            color: #f0f4f8; 
            z-index: 3; 
            text-shadow: 0 0 20px #000;
            white-space: nowrap; /* Запрещаем перенос строки */
        }
        
        .hero-text-bottom {
            position: absolute; bottom: 6vh; right: 5vw;
            font-family: 'Raleway', sans-serif; font-weight: 300; font-size: 1rem;
            letter-spacing: 0.3em; text-transform: uppercase; color: #888; z-index: 3;
        }

        /* 3. ГАЛЕРЕЯ */
        .section-gallery {
            width: 100%;
            background-color: #000; 
            padding: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery-grid {
            display: grid;
            width: 100%;
            max-width: 1200px;
            gap: 10px; 
            grid-template-columns: repeat(3, 1fr);
        }

        .gallery-item {
            position: relative;
            background-color: #111;
            border: 1px solid #222;
            overflow: hidden;
            cursor: pointer;
            border-radius: 2px;
            width: 100%;
            height: 100%;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            filter: grayscale(1) contrast(1.2) brightness(0.8);
            transition: all 0.6s ease;
        }

        .gallery-item:hover { border-color: #555; transform: scale(1.02); z-index: 10; }
        .gallery-item:hover img { filter: grayscale(0.5) contrast(1.1) brightness(1); }

        /* DESKTOP СЕТКА */
        .item-1 { grid-column: span 2; aspect-ratio: 16 / 9; }
        .item-2 { grid-column: span 1; aspect-ratio: 3 / 4; }
        .item-3 { grid-column: span 1; aspect-ratio: 3 / 4; }
        .item-4 { grid-column: span 1; aspect-ratio: 1 / 1; }
        .item-5 { grid-column: span 1; aspect-ratio: 1 / 1; }
        .item-6 { grid-column: span 2; aspect-ratio: 16 / 9; }

        .item-1 img { object-position: center 40%; }
        .item-2 img { object-position: center 20%; }
        .item-3 img { object-position: center center; }
        .item-4 img { object-position: center 20%; }
        .item-5 img { object-position: center 30%; }
        .item-6 img { object-position: center 30%; }

        /* 4. МАНИФЕСТ */
        .section-manifesto { background-color: #000; align-items: flex-start; }
        .manifesto-container { max-width: 800px; margin: 0 auto; text-align: left; }
        .manifesto-block {
            font-family: 'Montserrat', sans-serif; font-weight: 300;
            font-size: clamp(1.1rem, 2vw, 1.3rem); line-height: 2.2; color: #a0a0a0; margin-bottom: 80px;
        }
        .manifesto-block strong { color: #fff; font-weight: 400; }
        .manifesto-block span { display: block; padding-left: 20px; border-left: 1px solid #333; margin: 10px 0; color: #e0e0e0; }

        /* 5. ССЫЛКИ */
        .section-links { background-color: #050505; }
        .bento-skeleton { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 900px; width: 100%; }
        .link-box {
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; height: 150px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .link-box h3 { font-family: 'Raleway', sans-serif; font-weight: 400; letter-spacing: 0.1em; margin-bottom: 5px;}
        .link-box p { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 0.2em;}
        .link-box.wide { grid-column: span 2; }

        /* 6. ФИНАЛ */
        .section-final { height: 60vh; background-color: #000; text-align: center; }
        .section-final h2 { font-family: 'Raleway', sans-serif; font-weight: 300; font-size: 1.5rem; letter-spacing: 0.1em;}

        /* --- ЛАЙТБОКС --- */
        .lightbox {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; backdrop-filter: blur(8px);
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 95%; max-height: 90vh; object-fit: contain; box-shadow: 0 0 50px rgba(255, 0, 60, 0.2); transform: scale(0.95); transition: transform 0.4s ease; }
        .lightbox.active img { transform: scale(1); }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            section { padding: 60px 15px; }
            .hero-bg { width: 100%; right: 0; mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 10%, transparent 70%); }
            .hero-name { left: 5vw; top: 45%; font-size: clamp(3rem, 14vw, 6rem); }
            .hero-text-top { top: 6vh; }
            .hero-text-bottom { right: 5vw; bottom: 6vh; left: auto; transform: none; }
            
            /* МОБИЛЬНАЯ ГАЛЕРЕЯ (СТРОГО ПО ТВОЕМУ ЗАПРОСУ) */
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-areas:
                    "heels heels"
                    "lacing face"
                    "selfie mirror"
                    "bottom bottom";
            }

            /* Настраиваем формы */
            .item-1 img { object-fit: contain; } /* Влезает целиком, без обрезки */
            .item-3 { grid-area: lacing; aspect-ratio: 9 / 16; } /* Шнуровка - длинная вертикаль */
            .item-2 { grid-area: face; aspect-ratio: 9 / 16; }   /* Лицо - длинная вертикаль */
            .item-4 { grid-area: selfie; aspect-ratio: 1 / 1; }  /* Селфи - квадрат */
            .item-5 { grid-area: mirror; aspect-ratio: 1 / 1; }  /* Зеркало - квадрат */
            ..item-6 img { object-fit: contain; } /* Влезает целиком, без обрезки */

            /* Фокус на лица и шпильки */
            .item
