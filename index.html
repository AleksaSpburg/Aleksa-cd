<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEKSA | Интро</title>
    <style>
        @font-face {
            font-family: 'TagType';
            src: url('fonts/TagType.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'TagType', cursive; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #intro-container {
            width: 95%; 
            max-width: 1100px;
            text-align: center;
            font-size: clamp(1.6rem, 4vw, 3.2rem); 
            line-height: 2; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5em; 
            padding: 20px;
        }

        .word {
            opacity: 0;
            display: inline-block;
            transform: translateY(15px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            letter-spacing: 5px; 
            color: #ffffff; 
            -webkit-text-stroke: 1px rgba(255, 0, 60, 0.8); 
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.2), 2px 2px 4px rgba(0,0,0,0.8); 
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.5), 0 0 5px rgba(255, 0, 60, 0.8); 
        }

        /* --- НОВЫЙ ЭФФЕКТ ИСЧЕЗНОВЕНИЯ (Растворение) --- */
        .word.explode {
            opacity: 0;
            /* Слова не улетают, а чуть увеличиваются, теряют цвет и размываются */
            transform: scale(1.3); 
            color: transparent; 
            -webkit-text-stroke: 1px rgba(255, 0, 60, 0.3); /* Обводка тоже бледнеет */
            text-shadow: none;
            filter: blur(20px); /* Сильное размытие */
            /* Долгое, плавное растворение (4 секунды) */
            transition: all 4s ease-in-out; 
        }

        #end-message {
            position: absolute;
            opacity: 0;
            font-size: 0.8rem;
            font-family: sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            transition: opacity 2s ease;
            pointer-events: none;
            bottom: 40px;
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div id="end-message">Интро завершено</div>

    <script>
        const text = "слышать, как тот, кто рядом дышит чаще — единственная музыка, под которую мы готовы терять себя";
        const container = document.getElementById('intro-container');
        const words = text.split(' ');

        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = word;
            container.appendChild(span);
        });

        const wordElements = document.querySelectorAll('.word');

        function startAnimation() {
            const wordDelay = 600; 

            wordElements.forEach((word, index) => {
                const delay = index * wordDelay; 
                setTimeout(() => {
                    word.classList.add('show');
                }, delay);
            });

            // Пауза после появления всех слов (4 секунды)
            const explodeDelay = (wordElements.length * wordDelay) + 4000; 
            
            setTimeout(() => {
                // Убираем рандомный разлет, просто добавляем класс
                wordElements.forEach(word => {
                    word.classList.add('explode');
                });
            }, explodeDelay); 

            // Текст исчезает полностью через 4 секунды после начала растворения
            setTimeout(() => {
                document.getElementById('end-message').style.opacity = '1';
            }, explodeDelay + 4000);
        }

        window.onload = startAnimation;
    </script>
</body>
</html>
